[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-agentic-ai-showcase"
version = "1.0.0"
description = "Inspectable LangGraph operations workflows with policy checks, MCP tools and human review"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1.0,<2", "mcp>=1.20,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
agent-eval = "agent_platform.evaluate:main"
agent-mcp = "agent_platform.mcp_server:main"

[tool.setuptools.packages.find]
include = ["agent_platform*"]

[tool.setuptools.package-data]
agent_platform = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
