[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-rag-showcase"
version = "1.0.0"
description = "Evidence-first healthcare operations RAG with FAISS, version filters and reproducible evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "scikit-learn>=1.5,<2", "faiss-cpu>=1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
integrations = ["ragas==0.3.7", "langchain-openai>=0.3,<1", "langsmith>=0.4,<1", "pinecone>=7,<8"]

[project.scripts]
rag-eval = "healthcare_rag.evaluate:main"
rag-scale = "healthcare_rag.scale:main"

[tool.setuptools.packages.find]
include = ["healthcare_rag*"]

[tool.setuptools.package-data]
healthcare_rag = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
